name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux lifecycle suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Cache the runtime probe image
        run: |
          docker pull busybox:latest
          docker pull python:3.12-slim

      - name: Ruff
        run: uv run ruff check src tests

      - name: Verify contract branch coverage
        run: uv run pytest -q tests/test_coverage.py

      - name: Run full suite with Docker matrix
        env:
          PREFLIGHTKIT_COMMIT: ${{ github.sha }}
        run: uv run pytest -q
