version: 1

target:
  image: pfk-fixture-drain-window
  port: 8000
  env:
    DRAIN_SECONDS: "0"
    EXIT_SECONDS: "0.3"

probe:
  image: preflightkit-probe-intentionally-missing:never

deployment:
  termination_grace_period: 30s
  drain:
    strategy: in_app
    in_app_window: 1200ms

probes:
  readiness:
    path: /ready

contracts:
  inflight: null
