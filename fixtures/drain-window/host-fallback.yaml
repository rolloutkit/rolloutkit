version: 1

target:
  image: rk-fixture-drain-window
  port: 8000
  env:
    DRAIN_SECONDS: "0"
    EXIT_SECONDS: "0.3"

probe:
  # A cached scratch image cannot boot the Python controller. This deliberately
  # exercises host fallback without depending on registry availability.
  image: rk-go-nosignal

deployment:
  termination_grace_period: 30s
  drain:
    strategy: in_app
    in_app_window: 1200ms

probes:
  readiness:
    path: /ready

contracts:
  inflight: null
