version: 1
target:
  image: rk-fixture-drain-window
  port: 8000
  env: {DRAIN_SECONDS: "0", EXIT_SECONDS: "0.3"}
deployment:
  termination_grace_period: 30s
  pre_stop: {type: sleep, duration: 5s}
  drain: {strategy: prestop}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  inflight: null
  startup: {budget: 15s}
