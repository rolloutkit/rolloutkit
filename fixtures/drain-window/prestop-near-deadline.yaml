version: 1
target:
  image: pfk-fixture-drain-window
  port: 8000
  # A wide absolute window keeps the intended 16.7% margin clear of daemon
  # event jitter on both Docker Desktop and loaded native-Linux runners.
  env: {DRAIN_SECONDS: "0", EXIT_SECONDS: "25"}
deployment:
  termination_grace_period: 30s
  drain: {strategy: prestop}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  inflight: null
  startup: {budget: 15s}
