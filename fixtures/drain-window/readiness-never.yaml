version: 1
target:
  image: rk-fixture-drain-window
  port: 8000
  env: {DRAIN_SECONDS: "2", EXIT_SECONDS: "2.2", READINESS_DROPS: "0"}
deployment:
  termination_grace_period: 30s
  drain: {strategy: in_app, in_app_window: 1200ms}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  startup: {budget: 15s}
  inflight: null
