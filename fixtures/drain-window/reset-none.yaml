version: 1
target:
  image: pfk-fixture-drain-window
  port: 8000
  env:
    DRAIN_SECONDS: "1.0"
    EXIT_SECONDS: "1.2"
    RESET_AFTER_SIGTERM: "1"
deployment:
  termination_grace_period: 30s
  drain: {strategy: none}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  startup: {budget: 15s}
