version: 1
target:
  image: pfk-fixture-drain-window
  port: 8000
  env: {DRAIN_SECONDS: "1.4", EXIT_SECONDS: "1.6"}
deployment:
  termination_grace_period: 30s
  drain: {strategy: in_app, in_app_window: 1300ms}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  startup: {budget: 15s}
