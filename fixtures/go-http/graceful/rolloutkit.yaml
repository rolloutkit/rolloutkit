# A realistic Kubernetes profile, not a fixture-sized one: the default 30s grace
# period with a 5s preStop sleep in front of it, which leaves the application 25s
# to actually shut down.
version: 1

target:
  image: rk-go-graceful
  port: 8000

deployment:
  platform: kubernetes
  termination_grace_period: 30s
  pre_stop:
    type: sleep
    duration: 5s
  drain:
    strategy: prestop

probes:
  readiness:
    path: /ready
    expected_status: 200

contracts:
  startup:
    budget: 15s
  inflight:
    mode: long_requests
    request:
      method: GET
      path: /work
      expected_duration: 50ms
    concurrent: 10
    # Left unset: derived from the measured baseline p50. At a 50ms endpoint
    # this is the only way to place the signal — the window is far too narrow
    # to guess at, and guessing is what the baseline exists to replace.

timeouts:
  startup: 30s
  shutdown: 60s
