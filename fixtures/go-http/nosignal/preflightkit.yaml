# A realistic Kubernetes profile, not a fixture-sized one: the default 30s grace
# period with a 5s preStop sleep in front of it, which leaves the application 25s
# to actually shut down.
version: 1

target:
  image: pfk-go-nosignal
  port: 8000

deployment:
  platform: kubernetes
  termination_grace_period: 30s
  pre_stop:
    type: sleep
    duration: 5s
  drain:
    strategy: prestop

probes:
  readiness:
    path: /ready
    expected_status: 200

contracts:
  startup:
    budget: 15s
  inflight:
    mode: long_requests
    request:
      method: GET
      path: /work
      expected_duration: 5s
    concurrent: 10
    # This fixture owns the timing: the signal must land while the fixed 5s
    # handler is sleeping. A baseline-derived midpoint varies with runner load
    # and can stop exercising destruction. Kept small against a handler five
    # times longer so the surviving window is 4.9s, not the 900ms that used to
    # let a loaded runner measure an empty one.
    sigterm_after: 100ms

timeouts:
  overall: 180s
  startup: 30s
  shutdown: 60s
