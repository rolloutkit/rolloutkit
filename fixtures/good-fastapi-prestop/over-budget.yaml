# Same image, same behaviour, a startup budget nothing could meet. Covers the
# SP001 over_budget branch without needing a deliberately slow image.
version: 1

target:
  image: rk-fixture-good
  port: 8000
  env:
    STARTUP_DELAY_SECONDS: "5"

deployment:
  platform: kubernetes
  termination_grace_period: 30s
  pre_stop:
    type: sleep
    duration: 5s
  drain:
    strategy: prestop

probes:
  readiness:
    path: /ready
    expected_status: 200

contracts:
  startup:
    budget: 100ms
  inflight:
    mode: long_requests
    request:
      method: GET
      path: /slow
      expected_duration: 5s
    concurrent: 10

timeouts:
  startup: 30s
  shutdown: 45s
