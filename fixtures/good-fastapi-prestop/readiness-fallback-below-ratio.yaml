# The default in-flight path with nothing behind it to measure.
#
# `contracts.inflight` is absent, so SP005 falls back to readiness, and readiness
# here returns immediately: no delay is configured, so its p50 is the transport
# and the framework's own dispatch, roughly a millisecond. That is under the 3ms
# window floor and under 10x the probe-path jitter on every host measured, so
# both clauses of the rule refuse it and the verdict is INCONCLUSIVE.
#
# Both, deliberately. A fixture that only failed the ratio would be betting on
# the host staying noisy — a quieter machine raises the ratio without the service
# changing at all, which is how the previous fixture for this branch was lost.
#
# Only one clause has to refuse for the verdict to hold, so the margin that
# matters is the larger of the two, and the interesting part is that it is a
# different clause on each host. Eight runs on each:
#
#   macOS     p50 0.33-0.79ms  floor 3.8x clear   ratio 1.8-4.1   ratio 2.4x clear
#   Linux CI  p50 1.01-1.19ms  floor 2.5x clear   ratio 2.1-2.4   ratio 4.2x clear
#
# On macOS the probe path is quiet, so the ratio runs up and the absolute floor
# is what holds. On the Linux runner the floor is closer and the ratio is what
# holds. Neither clause is comfortable on both hosts; together they are, at 3.8x
# worst case. That is the argument for the row existing, not the ratio alone.
version: 1
target:
  image: rk-fixture-good
  port: 8000
deployment:
  termination_grace_period: 30s
  drain: {strategy: none}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  startup: {budget: 15s}
  readiness: {latency_budget: 500ms}
