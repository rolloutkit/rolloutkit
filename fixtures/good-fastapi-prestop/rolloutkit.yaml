version: 1

target:
  image: rk-fixture-good
  port: 8000

deployment:
  platform: kubernetes
  termination_grace_period: 30s
  pre_stop:
    type: sleep
    duration: 5s
  drain:
    strategy: prestop

probes:
  readiness:
    path: /ready
    expected_status: 200

contracts:
  startup:
    budget: 15s
  inflight:
    mode: long_requests
    request:
      method: GET
      path: /slow
      expected_duration: 5s
    concurrent: 10
    # sigterm_after is deliberately absent: derived from the baseline p50, which
    # is the path most users will take. kills-inflight pins it explicitly, so
    # both sources are exercised by the matrix.

timeouts:
  startup: 30s
  shutdown: 45s
