version: 1
target:
  # Keep this timing branch on the smallest server fixture. Framework import
  # time under a loaded runner can be wider than Docker's measured startup
  # resolution and turns this into an unrelated application-startup test.
  image: pfk-fixture-stdlib
  port: 8000
deployment:
  termination_grace_period: 30s
  drain: {strategy: none}
probes:
  readiness: {path: /ready, expected_status: 200}
contracts:
  startup: {budget: 100ms}
  inflight: null
