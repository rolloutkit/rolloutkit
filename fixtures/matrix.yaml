# Expected verdicts, and the code path that has to produce each one.
#
# Two rules hold this file together, and `tests/test_coverage.py` enforces both:
#
#   1. Every verdict branch every contract declares must appear here — either
#      covered by a fixture, or listed under `uncovered` with a reason it cannot
#      be reached. A branch that is neither is a branch nothing tests.
#   2. Each expectation names a `branch`, not just a status. Two defects that
#      both produce FAIL are not the same regression, and a matrix that cannot
#      tell them apart goes green while a branch quietly stops working. SP006
#      shipped a WARN over a blown budget for exactly that reason: the status was
#      being checked, the route to it was not.
#
# A change here is a deliberate change to what rolloutkit claims about
# behaviour.

images:
  - name: rk-fixture-good
    context: good-fastapi-prestop
  - name: rk-fixture-kills
    context: kills-inflight
  - name: rk-fixture-ignores
    context: ignores-sigterm
  - name: rk-fixture-stdlib
    context: stdlib-http
  - name: rk-fixture-stopsignal
    context: stdlib-http
    dockerfile: Dockerfile.stopsignal
  - name: rk-fixture-wrapper
    context: stdlib-http
    dockerfile: Dockerfile.wrapper
  - name: rk-fixture-shell-exec
    context: stdlib-http
    dockerfile: Dockerfile.shell-exec
  - name: rk-fixture-shell-noexec
    context: stdlib-http
    dockerfile: Dockerfile.shell-noexec
  - name: rk-go-nosignal
    context: go-http/nosignal
  - name: rk-fixture-drain-window
    context: drain-window
  - name: rk-backlog-reset
    context: backlog-reset

fixtures:
  - name: readiness-fallback-slow
    image: rk-fixture-good
    config: good-fastapi-prestop/readiness-fallback-slow.yaml
    description: >
      Readiness is deliberately slow enough to separate half its p50 from daemon
      jitter. SP005 uses readiness as the real in-flight target and publishes a
      normal completion verdict.
    expect:
      SP005: {status: PASS, branch: all_completed}

  - name: readiness-fallback-25ms
    image: rk-fixture-good
    config: good-fastapi-prestop/readiness-fallback-25ms.yaml
    description: >
      The same resolve as readiness-fallback-slow at 25ms instead of 200ms —
      the near end of the range a real readiness probe occupies. Proves the
      fallback resolves on a window a service might plausibly have, not only on
      one wide enough to make the comparison trivial. Resolving takes both
      clauses, so the margin is the smaller of them: over eight runs on each of
      two hosts the worst was 5.0x, the ratio on the Linux runner.
    expect:
      SP005: {status: PASS, branch: all_completed}

  - name: readiness-fallback-below-ratio
    image: rk-fixture-good
    config: good-fastapi-prestop/readiness-fallback-below-ratio.yaml
    description: >
      Readiness with no delay at all, so the fallback window is the transport
      plus dispatch and nothing else. Both clauses of the rule refuse it — under
      10x the probe-path jitter and under the 3ms absolute floor — and SP005
      reports the refusal rather than guessing. The precondition's cause names
      the ratio here and may name the window on a very quiet host; the branch is
      the same either way, which is why the row asserts the branch.
    expect:
      SP005: {status: INCONCLUSIVE, branch: readiness_fallback_below_resolution}
    notes_absent:
      SP005:
        # The refusal happens before any request is issued. Both of these used
        # to print beside it and read as a second, competing cause.
        - "The window closed early"
        - "The experiment and traffic measurement completed"

  # SP001.within_resolution had a row here until 2026-09-03, and it is missing
  # on purpose rather than by oversight. The branch's band is
  # startup_resolution_ms wide — Docker's create/start round trip, paid before
  # the interval being judged begins — while the value inside it is the target's
  # boot time, detected on a 50ms TCP poll grid. The two are host-dependent and
  # do not move together. The row landed inside the band 37 times across two
  # hosts and never further than 52.8ms from an edge, against a poll step of
  # 100ms; a 38th run, on a CI runner 31% slower than normal, landed outside it,
  # and no budget value reaches 55ms, so there was nothing to recalibrate to. It
  # is classified decision_unit in contracts/catalog.py and proved by
  # tests/test_contracts.py. Adding a row back here would re-create a coin toss,
  # not coverage.

  - name: good-fastapi-prestop
    image: rk-fixture-good
    config: good-fastapi-prestop/rolloutkit.yaml
    description: >
      uvicorn's default graceful shutdown under a prestop drain strategy, with
      sigterm_after derived from the baseline rather than configured. Everything
      should pass.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: PASS, branch: all_completed}
      SP006: {status: PASS, branch: within_budget}

  - name: kills-inflight
    image: rk-fixture-kills
    config: kills-inflight/rolloutkit.yaml
    description: >
      SIGTERM handler calls os._exit(0). Exit code 0 makes the shutdown look
      clean to anything that only inspects the exit code, while every in-flight
      request is destroyed. Proves the contracts are independent.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: FAIL, branch: requests_destroyed}
      SP006: {status: PASS, branch: within_budget}

  - name: startup-over-budget
    image: rk-fixture-good
    config: good-fastapi-prestop/over-budget.yaml
    description: >
      The good image against a 100ms startup budget it cannot meet. Timing
      thresholds warn rather than fail, so this must not block CI.
    expect:
      SP001: {status: WARN, branch: over_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: PASS, branch: all_completed}
      SP006: {status: PASS, branch: within_budget}

  - name: nothing-in-flight
    image: rk-fixture-good
    config: good-fastapi-prestop/nothing-in-flight.yaml
    description: >
      Requests aimed at a millisecond endpoint with the signal held back four
      seconds. Nothing is in flight at T0, so SP005 measured an empty window and
      has to say so instead of reporting a clean sweep.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: ERROR, branch: nothing_in_flight}
      SP006: {status: PASS, branch: within_budget}
    notes_present:
      SP005:
        # The other direction: requests really were issued and really did all
        # finish, so the advice that names sigterm_after has to survive.
        - "The window closed early"

  - name: ignores-sigterm
    image: rk-fixture-ignores
    config: ignores-sigterm/rolloutkit.yaml
    description: >
      The signal is caught and ignored. Only SIGKILL stops the process, so the
      exit code is 137 and every open response dies with it. The regression that
      guards the old SP006 defect, where a blown budget was reported as a WARN
      because the FAIL branch was unreachable.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: FAIL, branch: shutdown_not_started}
      SP005: {status: INCONCLUSIVE, branch: shutdown_never_started}
      SP006: {status: FAIL, branch: past_deadline}

  - name: reacts-but-killed
    image: rk-fixture-ignores
    config: ignores-sigterm/reacts-but-killed.yaml
    description: >
      Readiness drops after SIGTERM, proving the process reacted, but its handler
      never exits. SIGKILL is therefore the actual end of a started shutdown.
    expect:
      SP003: {status: FAIL, branch: killed}

  - name: in-app-shutdown-never-started
    image: rk-fixture-ignores
    config: ignores-sigterm/in-app-shutdown-never-started.yaml
    description: >
      An in-app profile is declared but the process shows no readiness, accept,
      or voluntary-exit reaction after SIGTERM.
    expect:
      SP003: {status: FAIL, branch: shutdown_not_started}
      SP004: {status: INCONCLUSIVE, branch: shutdown_never_started}
      SP006: {status: FAIL, branch: past_deadline}

  - name: slow-shutdown
    image: rk-fixture-ignores
    config: ignores-sigterm/slow-shutdown.yaml
    description: >
      Same image, cleanup that runs to five sixths of the budget. Nothing is
      violated and the margin is thin — the WARN that separates "slow" from
      "late". The window is wide in absolute terms because the ratio is what
      this row proves and a narrow one measured the runner instead; the fixture
      says what was measured.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: WARN, branch: thin_margin}

  - name: pid1-discards-sigterm
    image: rk-fixture-stdlib
    config: stdlib-http/pid1-discards-sigterm.yaml
    description: >
      A stdlib server with no SIGTERM handler. This row was written expecting
      exit 143 and measured something else: PID 1 in a container is the init of
      a PID namespace, and the kernel discards signals whose disposition is the
      default for it. Nothing happens, the grace period runs out, SIGKILL ends
      it. Same branches as ignores-sigterm from a different cause, and kept
      because the cause is the one most likely to be in someone's image.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: FAIL, branch: signal_discarded}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: FAIL, branch: past_deadline}

  - name: default-disposition
    image: rk-fixture-wrapper
    config: stdlib-http/default-disposition.yaml
    description: >
      The same application behind a signal-forwarding wrapper. The shell holds
      PID 1 and traps SIGTERM, so the signal is delivered rather than discarded,
      and the application dies of it as an ordinary child process — exit 143.
      The exit code changes behind a forwarding wrapper, but SP003 judges the
      observed reaction and deadline rather than that code.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP002: {status: PASS, branch: stable}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: go-runtime-exit-2
    image: rk-go-nosignal
    config: go-http/nosignal/rolloutkit.yaml
    description: >
      A Go net/http server with no signal.Notify of its own, on scratch, as
      PID 1. The Go runtime installs a handler for every signal whether the
      program asks or not, so unlike the Python fixture above the signal is
      delivered — and then the runtime's death path resets the disposition,
      re-raises into the same kernel rule that discards it, and falls through to
      exit(2). The process stops itself in under 10ms and destroys every open
      request doing it. This row exists because SP003 used to call that
      `clean_exit`: 2 was not 137 and not 143, so it fell through to PASS.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: FAIL, branch: requests_destroyed}
      SP006: {status: PASS, branch: within_budget}

  - name: django-shipped-config
    image: rk-fixture-stdlib
    config: stdlib-http/django-shipped.yaml
    description: >
      Minimal reproduction of the shipped Django shell-form startup. PID 1 is
      sh, SIGTERM produces no observed reaction, and all in-flight work can
      finish only because the child keeps serving. SP005 must not call that PASS.
      The shell comes from this file's `command:`, not from the image, which is
      exec-form — the row the static reading used to be blind to, and the reason
      the note has to name the configuration rather than the entrypoint.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: FAIL, branch: signal_discarded}
      SP005: {status: INCONCLUSIVE, branch: shutdown_never_started}
      SP006: {status: FAIL, branch: past_deadline}
    notes_present:
      SP003: ["command in your configuration is shell-form"]

  # One image shape, two spellings of it, and the reason SP003's static note is
  # conditional. `notes_absent`/`notes_present` are asserted by
  # tests/test_fixtures.py: a status and a branch cannot see this defect,
  # because both rows are decided by branches that were already correct.
  - name: shell-form-exec-suppresses-the-note
    image: rk-fixture-shell-exec
    config: stdlib-http/shell-form-exec.yaml
    description: >
      `sh -c "exec python -u app.py"`. Shell-form to `docker inspect`, and the
      shell is gone by the time the signal is sent: PID 1 is python with its own
      SIGTERM handler. The report used to print the measurement and a note
      denying it, one above the other. Runtime evidence outranks a static
      reading, so the note is withheld and the disposition line stands alone.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}
    notes_absent:
      SP003: ["shell-form"]

  - name: shell-form-without-exec-keeps-the-note
    image: rk-fixture-shell-noexec
    config: stdlib-http/shell-form-no-exec.yaml
    description: >
      The same line without `exec`. The shell stays as PID 1, the kernel
      discards SIGTERM against its default disposition, and the application's
      own handler is unreachable behind it. The note describes what was
      measured, so it stays — this row is what stops the suppression above from
      becoming "never warn about shell-form".
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: FAIL, branch: signal_discarded}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: FAIL, branch: past_deadline}
    notes_present:
      SP003: ["shell-form"]

  - name: baseline-500
    image: rk-fixture-stdlib
    config: stdlib-http/baseline-500.yaml
    description: >
      The process reacts and exits, but the measured request path returns 500 in
      steady state. Only SP005 is INCONCLUSIVE; lifecycle contracts still speak.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: INCONCLUSIVE, branch: baseline_not_2xx}
      SP006: {status: PASS, branch: within_budget}

  - name: stopsignal-mismatch
    image: rk-fixture-stopsignal
    config: stdlib-http/stopsignal-mismatch.yaml
    description: >
      Exits 0 on SIGTERM and still carries a defect: the image declares
      STOPSIGNAL SIGQUIT, which Docker honours and Kubernetes ignores. A local
      `docker stop` test would show nothing wrong.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: flapping-readiness
    image: rk-fixture-stdlib
    config: stdlib-http/flapping-readiness.yaml
    description: >
      Readiness alternates between 200 and 503 after startup. Ten sequential
      steady-state observations must expose the instability rather than letting
      one lucky 200 stand for the endpoint.
    expect:
      SP002: {status: FAIL, branch: flapping}
      SP005: {status: SKIP, branch: disabled}

  - name: incorrect-readiness
    image: rk-fixture-stdlib
    config: stdlib-http/incorrect-readiness.yaml
    description: >
      Startup receives one 200, then readiness stays at 503 throughout the
      baseline. This is consistently wrong rather than flapping.
    expect:
      SP002: {status: FAIL, branch: incorrect}
      SP005: {status: SKIP, branch: disabled}

  - name: identical-readiness-health
    image: rk-fixture-stdlib
    config: stdlib-http/identical-readiness-health.yaml
    description: >
      Readiness and health return the same stable status, headers, and body, so
      readiness appears to carry no distinct routing signal.
    expect:
      SP002: {status: WARN, branch: same_as_health}
      SP005: {status: SKIP, branch: disabled}

  - name: slow-readiness
    image: rk-fixture-stdlib
    config: stdlib-http/slow-readiness.yaml
    description: >
      Every readiness result is correct and stable, but the maximum latency is
      over the declared budget. Timing noise is a warning, never a failure.
    expect:
      SP002: {status: WARN, branch: latency_over_budget}
      SP005: {status: SKIP, branch: disabled}

  - name: closes-listener-immediately-in-app
    image: rk-fixture-drain-window
    config: drain-window/immediate-in-app.yaml
    description: >
      The listener closes immediately after T0 under an in-app profile. This is
      the failing half of acceptance #3.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: FAIL, branch: in_app_listener_closed_early}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: accept-window-not-measured
    image: rk-fixture-drain-window
    config: drain-window/accept-window-unmeasured.yaml
    description: >
      The listener stops accepting 600ms after the probe's first request and two
      seconds before SIGTERM, while the process is still serving normally. The
      accept window comes out at roughly -1400ms, which is not a listener-close
      time at all: nothing after T0 was observed. SP004 must decline rather than
      publish a negative number as a closure that happened before it was asked
      for. The neutral wording is the one on the wire here — the probe is refused
      outright, not left unanswered.
    expect:
      SP004: {status: INCONCLUSIVE, branch: accept_window_unmeasured}

  - name: docker-desktop-host-fallback-port-proxy
    image: rk-fixture-drain-window
    config: drain-window/host-fallback.yaml
    desktop_only: true
    description: >
      A deliberately unavailable probe image exercises the host fallback.
      Docker Desktop then publishes the target through a userspace proxy, so
      in-app listener timing cannot describe the application directly.
    expect:
      SP004: {status: INCONCLUSIVE, branch: port_proxy_likely}

  - name: closes-listener-immediately-prestop
    image: rk-fixture-drain-window
    config: drain-window/immediate-prestop.yaml
    description: >
      The identical listener under preStop. Fast closure is not a defect because
      preStop owns routing removal; this is the passing half of acceptance #3.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: PASS, branch: prestop_not_applicable}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: drains-in-app
    image: rk-fixture-drain-window
    config: drain-window/drains-in-app.yaml
    description: >
      Readiness drops at T0 while the listener remains available beyond the
      declared in-app window with more than twenty percent reserve.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: PASS, branch: in_app_covered}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: drains-in-app-thin-margin
    image: rk-fixture-drain-window
    config: drain-window/thin-margin.yaml
    description: >
      The listener covers a ten-second declared window with roughly one second
      of reserve, safely inside the twenty-percent warning band across runners.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: WARN, branch: in_app_thin_margin}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: in-app-readiness-never-changes
    image: rk-fixture-drain-window
    config: drain-window/readiness-never.yaml
    description: >
      The listener covers the declared in-app window, but readiness remains 200
      throughout shutdown, so external routers never see a drain signal.
    expect:
      SP004: {status: WARN, branch: in_app_readiness_not_signaled}

  - name: no-drain-declared
    image: rk-fixture-drain-window
    config: drain-window/none.yaml
    description: >
      No drain mechanism is declared, so SP004 warns regardless of listener
      behavior.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: WARN, branch: none_uncovered}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: accept-then-reset-in-app
    image: rk-fixture-drain-window
    config: drain-window/reset-in-app.yaml
    description: >
      A socket opened while the declared window is still open completes its
      handshake and is then reset without any response. This overrides the
      in-app strategy verdict. The branch keys on when the connection was
      opened, and this fixture stays on the failing side of that boundary by a
      wide margin: over 24 runs across both hosts all 480 resets started between
      +12ms and +1019ms, against a 1200ms window.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: FAIL, branch: accept_then_reset}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  # The other side of that boundary, and the reason the boundary exists.
  #
  # Do not extend this pair by moving a fixture nearer the boundary. The
  # specimen measured at +55ms past the window (close at 1250ms against a
  # 1200ms window) was rejected for exactly that: over eight runs it produced
  # accept_then_reset six times and in_app_listener_closed_early twice, because
  # at that distance the reset and the listener's own close are the same event
  # to a probe resolved to 50ms. Reclassifying it does not settle it — it is
  # nondeterministic today and stays nondeterministic under the window rule, so
  # a row for it would be a coin toss wearing an expectation. A fixture belongs
  # here when its distance from the boundary exceeds the probe's resolution by
  # an order of magnitude, not when it completes a picture.
  - name: backlog-reset-after-window-in-app
    image: rk-backlog-reset
    config: backlog-reset/after-window.yaml
    description: >
      An ordinary server that keeps its promise: it serves the whole declared
      window, stops accepting while still listening, and then closes the
      listening socket. The close resets the connection the kernel had already
      handshaken into the backlog — but that connection was opened after the
      window elapsed, so it is evidence and not a defect, and the run passes.
      Eight runs on Darwin put the reset's start at +1844ms to +1878ms against a
      1200ms window; the close lands about 230ms into the probe attempt and
      about 260ms before that attempt's own timeout, so neither edge is close.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP002: {status: PASS, branch: stable}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: PASS, branch: in_app_covered}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: accept-then-reset-prestop
    image: rk-fixture-drain-window
    config: drain-window/reset-prestop.yaml
    description: >
      Under preStop the new-connection stream stops at T0, matching production
      routing removal. The reset fixture therefore cannot manufacture post-T0
      traffic, and listener behavior is evidence rather than an SP004 verdict.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: PASS, branch: prestop_not_applicable}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: accept-then-reset-none
    image: rk-fixture-drain-window
    config: drain-window/reset-none.yaml
    description: >
      With no drain strategy declared, SP004 keeps the actionable
      none-uncovered warning even if the observed listener also resets traffic.
      The reset failure branch is covered by the in-app row where a declared
      application-owned strategy can violate its contract.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: WARN, branch: none_uncovered}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: PASS, branch: within_budget}

  - name: prestop-near-deadline
    image: rk-fixture-drain-window
    config: drain-window/prestop-near-deadline.yaml
    description: >
      preStop makes SP004 listener timing not applicable even when T4 is near the
      shutdown budget. A 25s exit inside a 30s budget leaves a wide, stable
      16.7% thin margin; SP006 remains responsible for that deadline margin.
    expect:
      SP001: {status: PASS, branch: within_budget}
      SP003: {status: PASS, branch: shutdown_observed}
      SP004: {status: PASS, branch: prestop_not_applicable}
      SP005: {status: SKIP, branch: disabled}
      SP006: {status: WARN, branch: thin_margin}

