[project]
name = "rolloutkit"
version = "0.1.0"
description = "Measure what a container actually does during startup and shutdown. Evidence, not guesses."
readme = "README.md"
requires-python = ">=3.12"
# SPDX expression rather than `{ text = ... }`, which is the deprecated form.
# There is deliberately no `License :: OSI Approved ::` classifier below: with
# an SPDX expression the metadata is 2.4, and PyPI rejects a distribution that
# states the licence both ways.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "kubernetes",
    "graceful-shutdown",
    "sigterm",
    "docker",
    "containers",
    "ci",
    "rollout",
    "preflight",
    "readiness",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "httpx>=0.28",
    "anyio>=4.7",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/rolloutkit/rolloutkit"
Source = "https://github.com/rolloutkit/rolloutkit"
Issues = "https://github.com/rolloutkit/rolloutkit/issues"
Changelog = "https://github.com/rolloutkit/rolloutkit/blob/main/CHANGELOG.md"

[project.scripts]
rolloutkit = "rolloutkit.cli.main:app"
rk = "rolloutkit.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.15.8",
    "trio>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolloutkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]
