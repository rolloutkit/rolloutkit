[project]
name = "preflightkit"
version = "0.1.0.dev0"
description = "Measure what a container actually does during startup and shutdown. Evidence, not guesses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "httpx>=0.28",
    "anyio>=4.7",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.scripts]
preflightkit = "preflightkit.cli.main:app"
pfk = "preflightkit.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15.8",
    "trio>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflightkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]
